YAML
name: Build SciLab APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Fix Keystore and Google Services for com.aistudio.scilab.xkzr
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore
          cp debug.keystore ~/.android/debug.keystore

          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "scilab-project",
              "storage_bucket": "scilab-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.aistudio.scilab.xkzr" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly1234567890123" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": { "package_name": "com.example" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly1234567890123" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug -x lint --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciLab-Android-App
          path: |
            app/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
